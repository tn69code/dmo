<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
  <title>DMO - Video Mockup (Green Screen)</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  
  <style>
    /* --- CSS Variables --- */
    :root[data-theme="light"]{
        --color-primary:#0D6EFD;
        --color-primary-light:#4c8fee;
        --color-text:#212529;
        --color-bg-light:#ffffff;
        --color-bg-main:#f8f9fa;
        --color-card-bg:#ffffff;
        --color-border:#dee2e6;
        --shadow-soft:0 4px 12px rgba(0,0,0,0.1);
        --shadow-preview:0 8px 24px rgba(0,0,0,0.2);
        --color-mockup-bg: transparent; /* Preview background transparent */
        
        /* Notice Box Colors (Light) */
        --notice-bg: #fff3cd;
        --notice-text: #664d03;
        --notice-border: #ffecb5;
    }
    :root[data-theme="dark"]{
        --color-primary:#58b368;
        --color-primary-light:#6dc77f;
        --color-text:#e9ecef;
        --color-bg-light:#2c313a;
        --color-bg-main:#212529;
        --color-card-bg:#2c313a;
        --color-border:#444c5c;
        --shadow-soft:0 4px 12px rgba(0,0,0,0.4);
        --shadow-preview:0 8px 24px rgba(0,0,0,0.6);
        --color-mockup-bg: transparent;

        /* Notice Box Colors (Dark) */
        --notice-bg: #413006;
        --notice-text: #ffda6a;
        --notice-border: #58430a;
    }

    body{margin:0;font-family:'Inter',sans-serif;background-color:var(--color-bg-main);color:var(--color-text);transition:background-color 0.4s,color 0.4s}
    .div__tak{max-width:800px;margin:0 auto;padding:20px 10px}

    /* --- Header & Buttons --- */
    .header{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background-color:var(--color-card-bg);box-shadow:var(--shadow-soft);position:sticky;top:0;z-index:1000}
    .logo{font-size:1.6rem;font-weight:800;color:var(--color-primary);text-decoration:none;letter-spacing:-0.5px}
    .action-icons{display:flex;gap:12px;align-items: center;}
    
    .icon-btn {
        background: transparent;
        border: 2px solid transparent;
        cursor: pointer;
        color: var(--color-text);
        font-size: 1.4rem;
        width: 42px; 
        height: 42px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        transition: all 0.2s;
        padding: 0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .icon-btn:hover {
        background-color: var(--color-bg-main);
        color: var(--color-primary);
        transform: translateY(-2px);
    }
    
    #contact-admin-btn iconify-icon{ color:#1877F2; }
    
    /* --- Main Layout --- */
    .main-card{
        background-color: var(--color-card-bg);
        padding: 30px 20px;
        border-radius: 20px;
        box-shadow: var(--shadow-soft);
        text-align: center;
        margin-bottom: 20px;
        border: 1px solid var(--color-border);
    }
    .main-card h3{margin-bottom:5px;font-weight:700;}

    #mockupCountDisplay {
        font-size: 0.9rem;
        color: #6c757d;
        margin-bottom: 20px;
        font-weight: 500;
    }
    :root[data-theme="dark"] #mockupCountDisplay { color: #adb5bd; }

    /* NOTICE BOX STYLE */
    .notice-box {
        background-color: var(--notice-bg);
        color: var(--notice-text);
        border: 1px solid var(--notice-border);
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        line-height: 1.5;
    }
    .notice-box iconify-icon {
        font-size: 1.8rem;
        min-width: 30px;
    }

    label.upload-label{
        width: 100%;
        height: 220px; 
        margin-top: 10px;
        border: 3px dashed var(--color-primary);
        border-radius: 15px;
        color: var(--color-primary);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
        cursor: pointer;
        background-color: rgba(var(--color-primary-light), 0.02);
        transition: all 0.3s ease-in-out;
    }
    label.upload-label:hover{
        background-color: rgba(var(--color-primary-light), 0.1);
        transform: translateY(-2px);
    }
    
    #videoLoader { display:none; }
    
    /* Changed background-color to use CSS variable for preview only */
    .mockup-wrapper {
        position: relative;
        width: 280px; 
        margin: 0 auto;
        margin-top: 25px;
        aspect-ratio: 1840 / 3600; 
        box-shadow: var(--shadow-preview);
        border-radius: 40px; 
        overflow: hidden; 
        background-color: var(--color-mockup-bg); 
        transition: background-color 0.4s;
    }

    #userVideo {
        position: absolute;
        top: 5.5%; 
        left: 10.76%;
        width: 78.48%;
        height: 89%;
        object-fit: cover;
        z-index: 1;
        background-color: #000; 
    }

    #phoneFrame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
    }

    .controls { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; align-items: center;}
    .btn-group-action { display: flex; gap: 10px; width: 100%; justify-content: center; }
    
    .btn-primary{
        background-color:var(--color-primary)!important;
        border:none!important;
        color:var(--color-bg-light)!important;
        font-weight:bold;
        border-radius:12px;
        padding:14px 20px;
        width: 100%;
        font-size: 1rem;
        box-shadow: 0 4px 6px rgba(var(--color-primary), 0.3);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-outline-primary, .btn-danger { border-radius: 12px; }

    /* Custom Switch Style */
    .form-check-input {
        cursor: pointer; 
        width: 40px; 
        height: 20px;
        display: inline-block; 
    }
    .form-check-input:checked {
        background-color: var(--color-primary);
        border-color: var(--color-primary);
    }
    
    /* Background Color Selector Styles */
    .bg-selector-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        background-color: rgba(0,0,0,0.05);
        padding: 10px;
        border-radius: 12px;
        width: 100%;
    }
    .color-option {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }
    .color-swatch {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid var(--color-border);
    }

    #recordingCanvas { display: none; }
    .processing-text {
        color: var(--color-primary);
        font-weight: 600;
        display: none;
        margin-top: 10px;
        font-size: 0.9rem;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
  </style>
</head>
<body>

<div class="header">
    <a href="#" class="logo">DMO</a>
    <div class="action-icons">
        <button class="icon-btn" onclick="openFacebook()" id="contact-admin-btn" title="Contact via Facebook">
            <iconify-icon icon="logos:facebook"></iconify-icon>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" id="theme-toggle" title="Toggle Light/Dark Mode">
            <iconify-icon icon="ic:round-light-mode"></iconify-icon>
        </button>
    </div>
</div>

<div class="div__tak">
    <div class="main-card" id="uploadSection">
        <h3>Video Mockup Tool</h3>
        
        <p id="mockupCountDisplay">
            စုစုပေါင်း Mockup ပြုလုပ်ပြီးသူ: ...
        </p>

        <div class="notice-box">
            <iconify-icon icon="mdi:alert-circle-outline"></iconify-icon>
            <span>
                <strong>သတိပြုရန်:</strong> Video Mockup ပြုလုပ်ရန်အတွက် မိမိဖုန်း Screen Record ဖမ်းထားသော <strong>Video (MP4)</strong> ဖိုင်ကို အသုံးပြုပါ
            </span>
        </div>

        <label class="upload-label" for="videoLoader">
            <iconify-icon icon="mdi:cloud-upload-outline" style="font-size: 50px;"></iconify-icon>
            <span style="font-weight: 700;">Click to Upload Video</span>
            <input type="file" id="videoLoader" accept="video/*">
        </label>
    </div>

    <div class="main-card" id="previewSection" style="display: none;">
        <h3>Generated Video</h3>
        <div class="mockup-wrapper">
            <video id="userVideo" loop playsinline muted></video>
            <img id="phoneFrame" src="https://raw.githubusercontent.com/tn69code/dmo/refs/heads/main/bezelless_wgray.png" alt="Phone Frame">
        </div>

        <div class="controls">
            <div style="width: 100%; text-align: left;">
                <label style="font-weight: 600; margin-bottom: 8px; display: block;">Background Color (for Editing):</label>
                <div class="bg-selector-group">
                    <label class="color-option">
                        <input type="radio" name="bgColor" value="#00ff00" checked class="form-check-input" style="width: 20px; height: 20px;"> 
                        <div class="color-swatch" style="background-color: #00ff00;"></div>
                        Green Screen
                    </label>
                    <label class="color-option">
                        <input type="radio" name="bgColor" value="#0000ff" class="form-check-input" style="width: 20px; height: 20px;">
                        <div class="color-swatch" style="background-color: #0000ff;"></div>
                        Blue Screen
                    </label>
                </div>
                <small style="color: var(--color-text); opacity: 0.8; font-size: 0.8rem; display: block; margin-top: 5px;">
                    (Video Editor တွင် <b>Chroma Key</b> သုံး၍ နောက်ခံဖျောက်ပါ)
                </small>
            </div>

            <div class="form-check form-switch w-100 d-flex justify-content-between align-items-center border p-2 rounded">
                 <label class="form-check-label" for="limitDuration" style="cursor: pointer; user-select: none; font-weight: 500;">
                    15 Sec Only (Fast Mode)
                </label>
                <input class="form-check-input m-0" type="checkbox" id="limitDuration" checked>
            </div>

            <p class="processing-text" id="procText">Creating Video (Processing)...<br>ကျေးဇူးပြု၍ ခဏစောင့်ပါ။</p>
            
            <button class="btn btn-primary" id="downloadBtn" onclick="downloadVideo()">
                <iconify-icon icon="mdi:download" style="font-size: 1.3rem; vertical-align: sub; margin-right: 5px;"></iconify-icon> 
                Download Video
            </button>
            
            <div class="btn-group-action">
                <button class="btn btn-outline-primary" style="flex:1;" onclick="togglePlay()">Play/Pause</button>
                <button class="btn btn-danger" onclick="resetApp()">Reset</button>
            </div>
        </div>
    </div>
</div>

<canvas id="recordingCanvas"></canvas>

<script>
    // ======================================
    // 1. COUNTER API
    // ======================================
    const BASE_URL = 'https://api.counterapi.dev/v1/dmo-video-mockup-69/total_downloads';
    
    function getCount() {
        fetch(BASE_URL + '/', { cache: "no-store" }) 
        .then(res => {
            if (!res.ok) throw new Error("API Limit or Network Error");
            return res.json();
        })
        .then(data => {
            const count = (data && data.count) ? data.count : 0;
            document.getElementById('mockupCountDisplay').innerText = 
                `စုစုပေါင်း Mockup ပြုလုပ်ပြီးသူ: ${count}`;
        })
        .catch(err => {
            document.getElementById('mockupCountDisplay').innerText = 
                `စုစုပေါင်း Mockup ပြုလုပ်ပြီးသူ: (Offline)`;
        });
    }

    function incrementCount() {
        fetch(BASE_URL + '/up', { cache: "no-store" })
        .then(res => res.json())
        .then(data => {
            document.getElementById('mockupCountDisplay').innerText = 
                `စုစုပေါင်း Mockup ပြုလုပ်ပြီးသူ: ${data.count}`;
        })
        .catch(err => console.error("Increment Error:", err));
    }
    
    getCount();


    // ======================================
    // 2. APP LOGIC
    // ======================================
    const facebookUrl = 'https://www.facebook.com/share/1Biv8agdMC/';
    const frameSrc = "https://raw.githubusercontent.com/tn69code/dmo/refs/heads/main/bezelless_wgray.png";
    
    const SCALE_FACTOR = 0.4; 

    const frameImg = new Image();
    frameImg.crossOrigin = "anonymous";
    frameImg.src = frameSrc;

    const videoLoader = document.getElementById('videoLoader');
    const userVideo = document.getElementById('userVideo');
    const previewSection = document.getElementById('previewSection');
    const uploadSection = document.getElementById('uploadSection');
    const downloadBtn = document.getElementById('downloadBtn');
    const procText = document.getElementById('procText');
    const themeIcon = document.querySelector('#theme-toggle iconify-icon');

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        if (theme === 'dark') {
            themeIcon.setAttribute('icon', 'ic:round-dark-mode');
        } else {
            themeIcon.setAttribute('icon', 'ic:round-light-mode');
        }
    }
    
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    function openFacebook() { window.open(facebookUrl, '_blank'); }

    videoLoader.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const videoUrl = URL.createObjectURL(file);
        userVideo.src = videoUrl;
        userVideo.crossOrigin = "anonymous"; 
        
        uploadSection.style.display = 'none';
        previewSection.style.display = 'block';
        userVideo.play();
    });

    function togglePlay() {
        if (userVideo.paused) userVideo.play();
        else userVideo.pause();
    }

    function resetApp() {
        userVideo.pause();
        userVideo.src = "";
        videoLoader.value = "";
        previewSection.style.display = 'none';
        uploadSection.style.display = 'block';
        procText.style.display = 'none';
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = '<iconify-icon icon="mdi:download" style="font-size: 1.3rem; vertical-align: sub; margin-right: 5px;"></iconify-icon> Download Video';
    }

    async function downloadVideo() {
        if (!userVideo.src) return;

        incrementCount();

        downloadBtn.disabled = true;
        downloadBtn.innerText = "Generating... (Do not close)";
        procText.style.display = "block";
        
        const canvas = document.getElementById('recordingCanvas');
        const ctx = canvas.getContext('2d');
        
        const w = 1840 * SCALE_FACTOR;
        const h = 3600 * SCALE_FACTOR;
        canvas.width = w;
        canvas.height = h;

        const isShortMode = document.getElementById('limitDuration').checked;
        const maxDurationSec = 15; 
        
        // Get the selected background color for Chroma Keying
        const selectedBgColor = document.querySelector('input[name="bgColor"]:checked').value;

        let mimeType = 'video/webm;codecs=vp9'; 
        let fileExt = 'webm';
        if (MediaRecorder.isTypeSupported('video/mp4')) {
            mimeType = 'video/mp4';
            fileExt = 'mp4';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) {
             mimeType = 'video/webm;codecs=h264';
        }

        const stream = canvas.captureStream(24); 

        try {
            const audioStream = userVideo.captureStream ? userVideo.captureStream() : userVideo.mozCaptureStream ? userVideo.mozCaptureStream() : null;
            if (audioStream && audioStream.getAudioTracks().length > 0) {
                stream.addTrack(audioStream.getAudioTracks()[0]);
            }
        } catch(e) { console.warn("Audio capture warning:", e); }

        const mediaRecorder = new MediaRecorder(stream, { 
            mimeType: mimeType, 
            videoBitsPerSecond: 3000000 // Increased bitrate slightly for quality
        });
        const chunks = [];

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dmo-mockup-${Date.now()}.${fileExt}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            downloadBtn.disabled = false;
            downloadBtn.innerHTML = '<iconify-icon icon="mdi:download" style="font-size: 1.3rem; vertical-align: sub; margin-right: 5px;"></iconify-icon> Download Video';
            procText.style.display = "none";
            
            userVideo.loop = true;
            userVideo.play();
        };

        userVideo.pause();
        userVideo.currentTime = 0;
        userVideo.loop = false; 
        
        mediaRecorder.start();
        
        try {
            await userVideo.play();
        } catch(err) {
            console.error("Play failed:", err);
            resetApp();
            return;
        }

        let stopCheckInterval;

        function drawFrame() {
            if (mediaRecorder.state === "inactive") {
                if(stopCheckInterval) clearInterval(stopCheckInterval);
                return;
            }

            // --- CHROMA KEY FIX ---
            // Fill the canvas with the selected solid color (Green/Blue)
            ctx.fillStyle = selectedBgColor;
            ctx.fillRect(0, 0, w, h);
            
            // Draw Video
            ctx.drawImage(userVideo, 198 * SCALE_FACTOR, 198 * SCALE_FACTOR, 1444 * SCALE_FACTOR, 3204 * SCALE_FACTOR);
            
            // Draw Frame
            if (frameImg.complete) {
                ctx.drawImage(frameImg, 0, 0, w, h);
            }
            requestAnimationFrame(drawFrame);
        }
        drawFrame();

        if(isShortMode) {
            stopCheckInterval = setInterval(() => {
                if(userVideo.currentTime >= maxDurationSec) {
                    if(mediaRecorder.state !== "inactive") {
                        userVideo.pause();
                        mediaRecorder.stop();
                    }
                    clearInterval(stopCheckInterval);
                }
            }, 100); 
        }

        userVideo.onended = () => {
            if(mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                if(stopCheckInterval) clearInterval(stopCheckInterval);
            }
        };
    }
</script>

</body>
</html>
