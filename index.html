<html lang="en" data-theme="light">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
  <title>DMO - Modern Mockup Tool</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style id="obfuscated-styles">
/* Reset Button ကို အနီရောင် ပုံသေထားသော CSS */
:root[data-theme="light"]{--color-primary:#0D6EFD;--color-primary-light:#4c8fee;--color-text:#212529;--color-bg-light:#ffffff;--color-bg-main:#f8f9fa;--color-card-bg:#ffffff;--color-border:#dee2e6;--shadow-soft:0 4px 12px rgba(0,0,0,0.1);--shadow-preview:0 8px 24px rgba(0,0,0,0.2)}
:root[data-theme="dark"]{--color-primary:#58b368;--color-primary-light:#6dc77f;--color-text:#e9ecef;--color-bg-light:#2c313a;--color-bg-main:#212529;--color-card-bg:#2c313a;--color-border:#444c5c;--shadow-soft:0 4px 12px rgba(0,0,0,0.4);--shadow-preview:0 8px 24px rgba(0,0,0,0.6)}

body{margin:0;font-family:'Inter',sans-serif;background-color:var(--color-bg-main);color:var(--color-text);transition:background-color 0.4s,color 0.4s}
.div__tak{max-width:800px;margin:0 auto;padding:20px 10px}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background-color:var(--color-card-bg);box-shadow:var(--shadow-soft);position:sticky;top:0;z-index:1000}
.logo{font-size:1.6rem;font-weight:800;color:var(--color-primary);text-decoration:none;letter-spacing:-0.5px}
.action-icons{display:flex;gap:15px}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--color-text);font-size:1.5rem;padding:5px;border-radius:50%;transition:all 0.2s}
.icon-btn:hover{color:var(--color-primary);background-color:var(--color-bg-main)}
#contact-admin-btn iconify-icon{font-size:1.3rem;icon:'mdi:facebook';border:2px solid var(--color-text);border-radius:50%;padding:3px;color:#4267B2;background-color:var(--color-bg-light)}
#contact-admin-btn:hover iconify-icon{border-color:#4267B2;color:var(--color-primary)}

/* Main Card Style */
.main-card{
    background-color: var(--color-card-bg);
    padding: 30px 20px;
    border-radius: 20px;
    box-shadow: var(--shadow-soft);
    text-align: center;
    position: relative; /* Reset Button ကို နေရာချဖို့ */
}
.main-card h3{margin-bottom:5px;font-weight:600}
input{display:none}

/* 1. Upload Section Design (ပိုမိုကြီးမား ဆွဲဆောင်မှုရှိ) */
label{
    width: 100%;
    height: 220px; 
    margin-top: 20px;
    border: 3px dashed var(--color-primary);
    border-radius: 15px;
    color: var(--color-primary);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
    cursor: pointer;
    background-color: transparent;
    transition: all 0.3s ease-in-out;
}
label:hover{
    /* Hover effect ကို ပိုလှအောင် ပြင်ခြင်း */
    background-color: rgba(var(--color-primary-light), 0.05);
    border-color: var(--color-primary-light);
    transform: translateY(-2px);
}
iconify-icon{font-size:48px} /* Icon ကို အနည်းငယ် ကြီးအောင် လုပ်ခြင်း */
#span{font-weight:700; font-size: 1.1rem;}

/* 2. Generated Image Preview Design */
#img_div{
    margin-top: 25px;
    background-color: var(--color-bg-main);
    border-radius: 12px;
    padding: 15px;
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-preview); /* ပိုမိုထင်ပေါ်အောင် shadow ထည့်ခြင်း */
}
#img_div img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:6px;box-shadow:var(--shadow-soft)}
#imageCanvas{display:none}

/* Action Bar (Download Button) */
.action-bar-bottom{
    display:flex;
    justify-content:center;
    margin-top:20px;
}
.btn-primary{
    /* Download Button ကို အပြည့်လုပ်ခြင်း */
    width: 100%; 
    background-color:var(--color-primary)!important;
    border-color:var(--color-primary)!important;
    color:var(--color-bg-light)!important;
    font-weight:bold;
    border-radius:8px;
    padding:12px 25px; /* ပိုကြီးအောင် လုပ်ခြင်း */
    transition:all 0.2s;
    font-size: 1.1rem;
    margin-top: 20px; /* Preview နဲ့ ခွာပေးခြင်း */
}
.btn-primary:hover{background-color:var(--color-primary-light)!important;transform:translateY(-1px)}

/* Reset Button ကို ညာဘက်အပေါ်ထောင့်သို့ ရွှေ့ခြင်း */
#resetBtn{
    position: absolute;
    top: 15px;
    right: 15px;
    background-color: #dc3545!important;
    border: none;
    color: white!important;
    border-radius: 50%; /* လုံးဝန်းသောပုံစံ */
    width: 35px;
    height: 35px;
    padding: 0;
    font-size: 1rem;
    line-height: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: var(--shadow-soft);
    z-index: 10;
}
#resetBtn:hover{
    background-color: #c82333!important;
    transform: scale(1.05);
}

/* Mobile Adjustments (3. Mobile/Responsive) */
@media (max-width: 600px) {
    .header {
        padding: 10px 15px; /* header padding လျှော့ချခြင်း */
    }
    .main-card {
        padding: 20px 15px;
    }
    label {
        height: 180px; /* Mobile မှာ အနည်းငယ် သေးငယ်အောင် လုပ်ခြင်း */
        gap: 10px;
    }
    iconify-icon {
        font-size: 40px;
    }
    .btn-primary {
        padding: 10px 20px;
        font-size: 1rem;
    }
}

/* ***** NEW FIX FOR DARK MODE COUNT DISPLAY ***** */
:root[data-theme="dark"] #mockupCountDisplay {
    color: #ced4da !important; /* light gray အရောင်ဖြင့် ပြသရန် */
}
:root[data-theme="light"] #mockupCountDisplay {
    color: #6c757d !important; /* Light Mode မှာ ပုံမှန် မီးခိုးရောင် ပြသရန် */
}
/* ********************************************* */
</style>
</head>
<body>

<div class="header">
    <a href="#" class="logo">DMO</a>
    <div class="action-icons">
        <button class="icon-btn" onclick="openFacebook()" id="contact-admin-btn" title="Contact via Facebook">
            <iconify-icon icon="mdi:facebook"></iconify-icon>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" id="theme-toggle" title="Toggle Light/Dark Mode">
            <iconify-icon icon="ic:round-light-mode"></iconify-icon>
        </button>
    </div>
</div>

<div class="div__tak card-container">

<div class="main-card upload-section">
    <h3>Mockup Generator</h3>
    <p>Select a screenshot to perfectly fit the device frame.</p>
    
    <p class="mb-0 text-muted" id="mockupCountDisplay">
        စုစုပေါင်း Mockup ပြုလုပ်ပြီးသူ: Loading...
    </p>

    <label for="imageLoader">
        <iconify-icon icon="mdi:cloud-upload-outline"></iconify-icon>
        <span id="span">Click or Drag Image Here (PNG or JPG)</span>
        <input type="file" id="imageLoader" name="imageLoader" accept="image/*">
    </label>
</div>


<div class="main-card preview-section" id="preview-card" style="display:none;">
    <h3>Generated Mockup</h3>
    <button class="btn-closs fa fa-times" id="resetBtn" onClick="resetBtn()"></button> 

    <canvas id="imageCanvas"></canvas>
    
    <div id="img_div"></div>
    
    <div id="project" class="action-bar-bottom"><p class="ex1">
        <button class="btn btn-primary" id="download"><i class="fa fa-download"></i> Download Image</button>
    </p></div>
</div>

</div> 
<script type="text/javascript">

    const _0xfirebaseConfig = 'eyJhcGlLZXkiOiJBSXphU3lDOU5wcjltRHVCMl84ZUl0dk0tU1lrSjgxM2VsOXdOQlUiLCJhdXRoRG9tYWluIjoiZG1vNjktYjc2N2EuZmlyZWJhc2VhcHAuY29tIiwiZGF0YWJhc2VVUkwiOiJodHRwczovL2RtbzY5LWI3NjdhLWRlZmF1bHQtcnRkYi5hc2lhLXNvdXRoZWFzdDEuZmlyZWJhc2VkYXRhYmFzZS5hcHAiLCJwcm9qZWN0SWQiOiJkbW82OS1iNzY3YSIsInN0b3JhZ2VCdWNrZXQiOiJkbW82OS1iNzY3YS5maXJlYmFzZXN0b3JhZ2UuYXBwIiwibWVzc2FnaW5nU2VuZGVySWQiOiIyMzg0NDYwNDMxNDciLCJhcHBJZCI6IjE6MjM4NDQ2MDQzMTQ3OndlYjoxOGVkYzAyZTQzM2RhZjE5MDUyNzAiLCJtZWFzdXJlbWVudElkIjoiRy1TSllTVkpMRVNRIn0=';

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const countRef = database.ref('mockup_count/total'); 
    
    function listenForMockupCount() {
        countRef.on('value', (snapshot) => {
            const count = snapshot.val() || 0;
            document.getElementById('mockupCountDisplay').innerText = 
                `စုစုပေါင်း Mockup ပြုလုပ်ပြီးသူ: ${count}`;
        }, (error) => {
            console.error("Firebase Read Error:", error);
            document.getElementById('mockupCountDisplay').innerText = 
                `စုစုပေါင်း Mockup ပြုလုပ်ပြီးသူ: (Error Loading Count)`;
        });
    }

    function incrementMockupCount() {
        countRef.transaction((currentCount) => {
            return (currentCount || 0) + 1; 
        });
    }
    
    listenForMockupCount();


    // ======================================
    // 2. THEME & LINK FUNCTIONS
    // ======================================

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
    }
    
    function updateThemeIcon(theme) {
        const icon = document.getElementById('theme-toggle').querySelector('iconify-icon');
        if (theme === 'dark') {
            icon.setAttribute('icon', 'ic:round-dark-mode');
        } else {
            icon.setAttribute('icon', 'ic:round-light-mode');
        }
    }
    
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    function openFacebook() {
        const facebookUrl = _0x2c68[0]; 
        window.open(facebookUrl, '_blank');
    }

    // ======================================
    // 3. OPTIMIZED MOCKUP LOGIC (CRITICAL FIX)
    // ======================================

    // *** FIX 1: Preload Frame Immediately ***
    var frameImg = new Image();
    frameImg.src = _0x2c68[1]; 

    var imageLoader = document.getElementById("imageLoader");
    imageLoader.addEventListener("change", handleImage, false);
    var canvas = document.getElementById("imageCanvas");
    var ctx = canvas.getContext("2d");
    
    function handleImage(e) {
        if (!e.target.files[0]) return;
        
        document.getElementById('preview-card').style.display = 'block'; 
        document.getElementById('img_div').innerHTML = ''; 
        
        var reader = new FileReader();
        reader.onload = function(event) {
            var img = new Image();
            // Removed crossOrigin for user uploaded blob (not needed for local file)
            img.src = event.target.result;
            
            // *** FIX 2: Use img.decode() to prevent WHITE SCREEN ***
            // This ensures the image is fully processed by the browser before drawing
            img.decode()
            .then(() => {
                renderMockup(img);
            })
            .catch((err) => {
                // Fallback if decode fails
                console.warn("Decode failed, using onload", err);
                img.onload = function() {
                    renderMockup(img);
                };
            });
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function renderMockup(userImg) {
        canvas.width = 1840;
        canvas.height = 3600;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // *** FIX 3: Fill Black to prevent White Gaps ***
        ctx.fillStyle = "#000000";
        ctx.fillRect(200, 200, 1440, 3200);

        // Draw uploaded image with BLEED (Slightly larger than frame hole)
        ctx.drawImage(userImg, 198, 198, 1444, 3204);

        // Draw device frame on top
        if (frameImg.complete && frameImg.naturalWidth > 0) {
            drawFrameAndFinish();
        } else {
            frameImg.onload = function() {
                drawFrameAndFinish();
            };
        }
    }

    function drawFrameAndFinish() {
        ctx.drawImage(frameImg, 0, 0, 1840, 3600);
        
        var base64 = canvas.toDataURL("image/png");
        var fileToSave = new Image();
        fileToSave.onload = function() {
            document.getElementById("img_div").appendChild(this);
            incrementMockupCount(); 
            var_dl('project');
        };
        fileToSave.src = base64;
    }

    document.getElementById('download').onclick = function() {
        let canvasUrl = canvas.toDataURL("image/png");
        const createEl = document.createElement('a');
        createEl.href = canvasUrl;
        createEl.download = "mockup-dmo.png";
        createEl.click();
        createEl.remove();
    };

    // ======================================
    // 4. UTILITY FUNCTIONS
    // ======================================
    function var_dl(id) {
        document.getElementById(id).style.display='flex';
    }
    
    function resetBtn() {
        document.getElementById('preview-card').style.display = 'none'; 
        document.getElementById('img_div').innerHTML = ''; 
        document.getElementById("imageLoader").value = null; 
        
        alert("Mockup Tool ကို ပြန်လည်အသုံးပြုရန် အဆင်သင့်ဖြစ်ပါပြီ");
    }

</script>
    
</body>
</html>
