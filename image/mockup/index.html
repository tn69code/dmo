/* Reset CSS & Variables */
:root[data-theme="light"]{--color-primary:#0D6EFD;--color-primary-light:#4c8fee;--color-text:#212529;--color-bg-light:#ffffff;--color-bg-main:#f8f9fa;--color-card-bg:#ffffff;--color-border:#dee2e6;--shadow-soft:0 4px 12px rgba(0,0,0,0.1);--shadow-preview:0 8px 24px rgba(0,0,0,0.2)}
:root[data-theme="dark"]{--color-primary:#58b368;--color-primary-light:#6dc77f;--color-text:#e9ecef;--color-bg-light:#2c313a;--color-bg-main:#212529;--color-card-bg:#2c313a;--color-border:#444c5c;--shadow-soft:0 4px 12px rgba(0,0,0,0.4);--shadow-preview:0 8px 24px rgba(0,0,0,0.6)}

body{margin:0;font-family:'Inter',sans-serif;background-color:var(--color-bg-main);color:var(--color-text);transition:background-color 0.4s,color 0.4s}
.div__tak{max-width:800px;margin:0 auto;padding:20px 10px}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background-color:var(--color-card-bg);box-shadow:var(--shadow-soft);position:sticky;top:0;z-index:1000}
.logo{font-size:1.6rem;font-weight:800;color:var(--color-primary);text-decoration:none;letter-spacing:-0.5px}

/* Action Icons (Header) */
.action-icons{display:flex;gap:12px;align-items: center;}
.icon-btn {
    background: transparent;
    border: 2px solid transparent;
    cursor: pointer;
    color: var(--color-text);
    width: 40px; height: 40px; /* အနည်းငယ် သေးလိုက်သည် */
    display: flex; justify-content: center; align-items: center;
    border-radius: 50%; transition: all 0.2s; padding: 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
.icon-btn:hover { background-color: var(--color-bg-main); color: var(--color-primary); transform: translateY(-2px); }

/* *** FIX 1: Header Icon Size Control *** */
.icon-btn iconify-icon {
    font-size: 1.4rem !important; /* Header icons တွေကို အနေတော် အရွယ် ပြန်ထားသည် */
}
#contact-admin-btn iconify-icon{ color:#1877F2; }

/* Main Card Style */
.main-card{
    background-color: var(--color-card-bg);
    padding: 30px 20px;
    border-radius: 20px;
    box-shadow: var(--shadow-soft);
    text-align: center;
    position: relative;
}
.main-card h3{margin-bottom:5px;font-weight:600}
input{display:none}

/* Upload Section */
label{
    width: 100%; height: 220px; margin-top: 20px;
    border: 3px dashed var(--color-primary);
    border-radius: 15px; color: var(--color-primary);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 15px; cursor: pointer; background-color: transparent;
    transition: all 0.3s ease-in-out;
}
label:hover{ background-color: rgba(var(--color-primary-light), 0.05); transform: translateY(-2px); }

/* *** Upload Area Icon Specific *** */
label iconify-icon {
    font-size: 48px !important; /* Upload နေရာက Icon ကိုတော့ ကြီးကြီးထားမည် */
}

#span{font-weight:700; font-size: 1.1rem;}

/* Generated Image Preview Design */
#img_div{
    margin-top: 20px;
    background-color: transparent; 
    border: none; 
    box-shadow: none; 
    padding: 0;
    text-align: center;
}
#img_div img{
    max-width:100%; height:auto; display:inline-block;
    border-radius: 20px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.25); 
}
#imageCanvas{display:none}

/* Buttons */
.action-bar-bottom{ display:flex; justify-content:center; margin-top:20px; }
.btn-primary{
    width: 100%; background-color:var(--color-primary)!important;
    border-color:var(--color-primary)!important; color:var(--color-bg-light)!important;
    font-weight:bold; border-radius:8px; padding:12px 25px;
    transition:all 0.2s; font-size: 1.1rem; margin-top: 10px;
}
.btn-primary:hover{background-color:var(--color-primary-light)!important;transform:translateY(-1px)}

/* Reset Button */
#resetBtn{
    position: absolute; top: 15px; right: 15px;
    background-color: #dc3545!important; border: none; color: white!important;
    border-radius: 50%; width: 35px; height: 35px;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; box-shadow: var(--shadow-soft); z-index: 10;
}
#resetBtn:hover{ transform: scale(1.1); }

/* Responsive */
@media (max-width: 600px) {
    .header { padding: 10px 15px; }
    .main-card { padding: 20px 15px; }
    label { height: 180px; gap: 10px; }
}

/* Dark Mode Text Fix */
:root[data-theme="dark"] #mockupCountDisplay { color: #ced4da !important; }
:root[data-theme="light"] #mockupCountDisplay { color: #6c757d !important; }
</style>
</head>
<body>

<div class="header">
    <a href="#" class="logo">DMO</a>
    <div class="action-icons">
        <button class="icon-btn" onclick="openFacebook()" id="contact-admin-btn">
            <iconify-icon icon="logos:facebook"></iconify-icon>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" id="theme-toggle">
            <iconify-icon icon="ic:round-light-mode"></iconify-icon>
        </button>
    </div>
</div>

<div class="div__tak card-container">

<div class="main-card upload-section">
    <h3>Image Mockup Tool</h3>
    <p>Select a screenshot to perfectly fit the device frame.</p>
    
    <p class="mb-0 text-muted" id="mockupCountDisplay">
        Loading count...
    </p>

    <label for="imageLoader">
        <iconify-icon icon="mdi:cloud-upload-outline"></iconify-icon>
        <span id="span">Click or Drag Image Here</span>
        <input type="file" id="imageLoader" name="imageLoader" accept="image/*">
    </label>
</div>
<br>
<div class="main-card preview-section" id="preview-card" style="display:none;">
    <h3>Generated Mockup</h3>
    <button class="btn-closs fa fa-times" id="resetBtn" onClick="resetBtn()"></button> 

    <canvas id="imageCanvas"></canvas>
    
    <div id="img_div"></div>
    
    <div id="project" class="action-bar-bottom" style="display:none;">
        <button class="btn btn-primary" id="download"><i class="fa fa-download"></i> Download Image</button>
    </div>
</div>

</div>

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);

    function updateThemeIcon(theme) {
        const icon = document.getElementById('theme-toggle').querySelector('iconify-icon');
        if (theme === 'dark') {
            icon.setAttribute('icon', 'ic:round-dark-mode');
